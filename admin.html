<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYE ON - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        
        /* 🔒 লগইন বক্স সেন্টারিং */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 85vh; }
        .admin-login-overlay { background: white; padding: 35px; border-radius: 8px; max-width: 340px; width: 100%; box-shadow: 0px 4px 15px rgba(0,0,0,0.15); text-align: center; }
        .admin-login-overlay h2 { color: #f57224; margin-top: 0; }
        .admin-login-overlay p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        /* 🛠️ মেইন ড্যাশবোর্ড লেআউট (ডিফল্টভাবে একদম হাইড করা) */
        .admin-dashboard { max-width: 1200px; margin: 0 auto; display: none; gap: 20px; }
        .left-panel { display: flex; flex-direction: column; gap: 20px; flex: 1; min-width: 320px; }
        .card-box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); }
        .right-panel { background: white; padding: 25px; border-radius: 8px; flex: 2; box-shadow: 0px 4px 10px rgba(0,0,0,0.05); }
        
        h2 { margin-top: 0; border-bottom: 2px solid #f57224; padding-bottom: 8px; color: #333; font-size: 20px; }
        label { font-weight: bold; display: block; margin-top: 12px; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; outline: none; font-family: Arial, sans-serif; }
        input:focus, textarea:focus { border-color: #f57224; }
        
        .btn-submit { width: 100%; background: #28a745; color: white; border: none; padding: 12px; margin-top: 20px; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-login { width: 100%; background: #f57224; color: white; border: none; padding: 12px; margin-top: 10px; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .nav-link { display: block; text-align: center; margin-top: 15px; color: #007bff; text-decoration: none; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f57224; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .clear-orders-btn { background: #ff4d4d; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-bottom: 10px; float: right; }
        .uploaded-list { max-height: 300px; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
        .product-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; border: 1px solid #eee; border-radius: 4px; background: #fafafa; }
        .product-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
        .product-details { flex-grow: 1; margin-left: 10px; }
        .product-details h4 { margin: 0; font-size: 13px; color: #333; }
        .product-details span { font-size: 12px; color: #f57224; font-weight: bold; }
        .btn-delete-item { background: #ff4d4d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

<div class="login-container" id="loginArea">
    <div class="admin-login-overlay">
        <h2>RYE ON ADMIN</h2>
        <p>পাসওয়ার্ড দিয়ে এডমিন ড্যাশবোর্ডে প্রবেশ করুন</p>
        <input type="password" id="adminPassword" placeholder="পাসওয়ার্ড লিখুন..." onkeypress="handleKeyPress(event)">
        <button class="btn-login" onclick="checkAdminLogin()">লগইন করুন</button>
    </div>
</div>

<div class="admin-dashboard" id="adminDashboardLayout">
    <div class="left-panel">
        <div class="card-box">
            <h2>নতুন প্রোডাক্ট যোগ করুন</h2>
            <form id="productForm">
                <label>কাপড়ের নাম:</label>
                <input type="text" id="pName" placeholder="যেমন: Premium T-Shirt" required>
                
                <label>দাম (BDT):</label>
                <input type="number" id="pPrice" placeholder="যেমন: 590" required>
                
                <label>ছবির লিংক (URL):</label>
                <input type="url" id="pImg" placeholder="ইমেজ লিংক পেস্ট করুন..." required>
                
                <label>প্রোডাক্ট ডিসক্রিপশন (Description):</label>
                <textarea id="pDesc" rows="4" placeholder="সাইজ ও ডিটেইলস লিখুন..." required></textarea>
                
                <button type="submit" class="btn-submit">আপলোড করুন</button>
            </form>
            <a class="nav-link" href="index.html" target="_blank">লাইভ শপ পেজ দেখুন →</a>
        </div>
        
        <div class="card-box">
            <h2>প্রোডাক্ট ম্যানেজমেন্ট (Delete Items)</h2>
            <div class="uploaded-list" id="uploadedProductsContainer"></div>
        </div>
    </div>
    
    <div class="right-panel">
        <button class="clear-orders-btn" onclick="clearAllOrders()">সব অর্ডার মুছুন</button>
        <h2>গ্রাহকদের অর্ডার লিস্ট (Live Orders)</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>তারিখ ও সময়</th>
                        <th>কাস্টমারের নাম</th>
                        <th>মোবাইল নাম্বার</th>
                        <th>ডেলিভারি ঠিকানা</th>
                        <th>প্রোডাক্টের নাম</th>
                        <th>টোটাল বিল</th>
                        <th>পেমেন্ট মেথড</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // 🔑 আপনার পাসওয়ার্ড
    const CORRECT_PASSWORD = "admin"; 
    const DEFAULT_FALLBACK_IMG = "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400&q=80";

    function checkAdminLogin() {
        const inputPassword = document.getElementById('adminPassword').value;
        
        if (inputPassword === CORRECT_PASSWORD) {
            alert('লগইন সফল হয়েছে!');
            
            // লগইন এরিয়া সম্পূর্ণ ভ্যানিশ করা
            document.getElementById('loginArea').style.display = 'none';
            
            // ড্যাশবোর্ড গ্রিড ওপেন করা
            const dashboard = document.getElementById('adminDashboardLayout');
            dashboard.style.display = 'flex'; 
            
            loadIncomingOrders();  
            loadUploadedProducts(); 
        } else {
            alert('ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।');
            document.getElementById('adminPassword').value = '';
        }
    }

    function handleKeyPress(e) { 
        if (e.key === 'Enter') { checkAdminLogin(); } 
    }

    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const img = document.getElementById('pImg').value;
        const desc = document.getElementById('pDesc').value;

        let products = JSON.parse(localStorage.getItem('ryeon_products')) || [];
        products.push({ id: Date.now(), name, price, img, desc });
        localStorage.setItem('ryeon_products', JSON.stringify(products));
        
        alert('প্রোডাক্টটি সফলভাবে আপলোড হয়েছে!');
        document.getElementById('productForm').reset();
        loadUploadedProducts(); 
    });

    function loadUploadedProducts() {
        const container = document.getElementById('uploadedProductsContainer');
        const products = JSON.parse(localStorage.getItem('ryeon_products')) || [];
        container.innerHTML = '';
        if(products.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#999; font-size:13px; margin:15px 0;">কোনো প্রোডাক্ট আপলোড করা নেই।</p>`;
            return;
        }
        
        products.forEach((product, index) => {
            const itemRow = document.createElement('div');
            itemRow.classList.add('product-item');
            itemRow.innerHTML = `
                <img src="${product.img}" onerror="this.onerror=null; this.src='${DEFAULT_FALLBACK_IMG}';">
                <div class="product-details">
                    <h4>${product.name}</h4>
                    <span>৳${product.price}</span>
                </div>
                <button class="btn-delete-item" onclick="deleteSingleProduct(${index})"><i class="fa-solid fa-trash-can"></i> Delete</button>
            `;
            container.appendChild(itemRow);
        });
    }

    function deleteSingleProduct(index) {
        let products = JSON.parse(localStorage.getItem('ryeon_products')) || [];
        if(confirm(`আপনি কি নিশ্চিতভাবে "${products[index].name}" প্রোডাক্টটি শপ থেকে ডিলিট করতে চান?`)) {
            products.splice(index, 1);
            localStorage.setItem('ryeon_products', JSON.stringify(products));
            loadUploadedProducts();
            alert('প্রোডাক্টটি সফলভাবে মুছে ফেলা হয়েছে!');
        }
    }

    function loadIncomingOrders() {
        const tbody = document.getElementById('ordersTableBody');
        const orders = JSON.parse(localStorage.getItem('ryeon_orders')) || [];
        tbody.innerHTML = ''; 
        if(orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#999; padding: 20px;">এখনো কোনো কাস্টমার কিছু অর্ডার করেনি!</td></tr>`;
            return;
        }
        [...orders].reverse().forEach(order => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${order.date || ''}</td>
                <td style="font-weight:bold; color:#333;">${order.customerName || ''}</td>
                <td style="color:green; font-weight:bold;">${order.customerPhone || ''}</td>
                <td>${order.customerAddress || ''}</td>
                <td style="color:#f57224;">${order.products || ''}</td>
                <td style="font-weight:bold;">৳${order.totalPrice || ''}</td>
                <td><span style="background:#eee; padding:3px 6px; border-radius:3px; font-size:11px;">${order.paymentMethod || ''}</span></td>
            `;
            tbody.appendChild(row);
        });
    }

    function clearAllOrders() {
        if(confirm("আপনি কি নিশ্চিতভাবে সব কাস্টমার ডাটা মুছে ফেলতে চান?")) {
            localStorage.removeItem('ryeon_orders');
            loadIncomingOrders();
        }
    }
</script>
</body>
</html>
